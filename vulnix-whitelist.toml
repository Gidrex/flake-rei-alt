comment = "Ada.cx SaaS, not the ada URL parser"

["gstreamer-1.28.6"]
cve = [ "CVE-2026-73433" ]
comment = "fixed upstream in 1.28.6, which is the vendored version"

["libmicrohttpd-1.0.6"]
