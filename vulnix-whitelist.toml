# Vulnix false-positive whitelist for `just vulnix-audit` / `just audit`.
# Syntax: TOML sections ["<pname>-<version>"] or ["<pname>"] (any version),
# with a `cve` list. A rule only masks the listed CVEs; any NEW CVE for the
# same package still shows up. Verified against the 2026-09-20 audit.
# Re-check a rule (remove it) when nixpkgs is updated past the fixed version.

# NOTE: product-mismatch entries are deliberately UNVERSIONED (["pname"]).
# A CVE about a different product never applies, whatever version nixpkgs
# vendors — and unversioned sections also cover -fish-completions split
# derivations (their version string is "X.Y-fish-completions").
# Versioned sections are only for "fixed in vendored version" entries below:
# those must re-appear after a nixpkgs update so the fix gets re-verified.

["cargo"]
cve = [
  "CVE-2026-14363",
  "CVE-2026-58521",
  "CVE-2026-39839",
  "CVE-2026-39840",
  "CVE-2026-39841",
  "CVE-2026-39837",
  "CVE-2026-58519",
]
comment = "Rust cargo, not the MediaWiki Cargo extension"

["git"]
cve = [
  "CVE-2022-36882",
  "CVE-2022-30947",
  "CVE-2022-36883",
  "CVE-2022-38663",
  "CVE-2021-21684",
  "CVE-2022-36884",
]
comment = "Jenkins Git Plugin, not git itself (covers git + git-*-fish-completions)"

["kitty"]
cve = [
  "CVE-2024-23749",
  "CVE-2024-25003",
  "CVE-2024-25004",
]
comment = "KiTTY (Windows PuTTY fork), not kitty terminal"

["ninja"]
